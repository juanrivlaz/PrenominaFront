<div id="main-navigation" class="nav">
    @for (item of itemNavigation; track item.id) {
        @if (item.type === 'collapse') {
            <app-nav-collapse [item]="item" />
        }
        @if (item.type === 'item') {
            <app-nav-item [item]="item" />
        }
        @if (item.type === 'group') {
            <app-nav-group [item]="item" />
        }
    }
</div>
