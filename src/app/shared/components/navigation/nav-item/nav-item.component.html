@if (item()?.url) {
    <a class="nav-link" [routerLink]="[item()?.url]" routerLinkActive="active"
       [routerLinkActiveOptions]="{exact: item()?.exactMatch || false}" matRipple>

        @if (item()?.icon && !item()?.iconCustom) {
            <mat-icon class="nav-link-icon">{{item()?.icon}}</mat-icon>
        }
        @if (item()?.iconCustom) {
            <mat-icon class="nav-link-icon-custom" svgIcon="{{ item()?.icon }}"></mat-icon>
        }

        <span class="nav-link-title" [translate]="item()?.translate">{{item()?.title}}</span>
    </a>
}

@if (item()?.function) {
    <span class="nav-link" (click)="item()?.function?.()" matRipple>
        @if (item()?.icon) {
            <mat-icon class="nav-link-icon">{{item()?.icon}}</mat-icon>
        }
        <span class="nav-link-title" [translate]="item()?.translate">{{item()?.title}}</span>
    </span>
}
