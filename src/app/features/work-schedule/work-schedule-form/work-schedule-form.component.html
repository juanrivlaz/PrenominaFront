<h2 mat-dialog-title>
    @if (data.mode === 'edit') {
        Editar horario
    } @else {
        Nuevo horario
    }
</h2>

<form [formGroup]="form" (ngSubmit)="submit()">
    <mat-dialog-content class="form-content">
        <mat-form-field appearance="outline">
            <mat-label>Nombre del horario</mat-label>
            <input matInput formControlName="label" placeholder="Ej. Turno nocturno">
        </mat-form-field>

        <div class="row">
            <mat-form-field appearance="outline">
                <mat-label>Hora de entrada</mat-label>
                <input matInput type="time" formControlName="startTime">
            </mat-form-field>

            <mat-form-field appearance="outline">
                <mat-label>Hora de salida</mat-label>
                <input matInput type="time" formControlName="endTime">
            </mat-form-field>
        </div>

        <mat-form-field appearance="outline">
            <mat-label>Horas laborables</mat-label>
            <input matInput type="number" formControlName="workHours" min="0" step="0.5">
        </mat-form-field>

        <div class="row">
            <mat-form-field appearance="outline">
                <mat-label>Inicio descanso (opcional)</mat-label>
                <input matInput type="time" formControlName="breakStart">
            </mat-form-field>

            <mat-form-field appearance="outline">
                <mat-label>Fin descanso (opcional)</mat-label>
                <input matInput type="time" formControlName="breakEnd">
            </mat-form-field>
        </div>

        <div class="night-toggle">
            <mat-slide-toggle formControlName="isNightShift">
                Turno nocturno
            </mat-slide-toggle>
            <span class="hint">
                Activa este interruptor cuando la salida ocurre el día siguiente al de la entrada
            </span>
        </div>
    </mat-dialog-content>

    <mat-dialog-actions align="end">
        <button type="button" mat-button mat-dialog-close [disabled]="loading()">Cancelar</button>
        <button type="submit" mat-flat-button color="primary" [disabled]="loading()">
            @if (loading()) {
                Guardando...
            } @else {
                Guardar
            }
        </button>
    </mat-dialog-actions>
</form>
