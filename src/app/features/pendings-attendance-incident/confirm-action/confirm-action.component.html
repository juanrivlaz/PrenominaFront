<h2 mat-dialog-title>Confirmar Incidencia</h2>
<mat-dialog-content>
  <p>¿Estas seguro de {{ data.type }} la Incidencia?</p>
  <p class="center">{{ data.name }}</p>
  <p class="center">{{ data.incident }}</p>
  <p class="center">{{ data.date }}</p>
  <p class="center">Notas: {{ data.note }}</p>

  @if (isReject) {
    <mat-form-field appearance="outline" class="reject-comment">
      <mat-label>Motivo del rechazo</mat-label>
      <textarea
        matInput
        [formControl]="comment"
        rows="3"
        maxlength="500"
        placeholder="Describe el motivo del rechazo (opcional)"
      ></textarea>
      <mat-hint align="end">{{ comment.value.length }}/500</mat-hint>
    </mat-form-field>
  }
</mat-dialog-content>
<mat-dialog-actions>
  <button mat-button mat-dialog-close>Cancelar</button>
  <button mat-flat-button (click)="confirm()" cdkFocusInitial>Confirmar</button>
</mat-dialog-actions>
